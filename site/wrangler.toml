# The public site, www.waldorf.co.il (launch-checklist A4, B9).
#
# A Worker with static assets, like waldorf-admin, rather than Cloudflare
# Pages: Pages cannot turn off the .html -> clean-URL redirect, and every
# address on this site ends in .html (A2). Built from mockup/pages:
#
#     node site/build.mjs
#     cd site && npx wrangler@4 deploy
#
# Pushing to main does not deploy it; the deploy is by hand, like the other
# Workers. The rehearsal address is https://waldorf-site.orenknaan.workers.dev.
name = "waldorf-site"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# The domain itself (C5). Both hostnames were attached on 2026-11-06 as custom
# domains of the Pages project waldorf-co-il, which publishes an empty folder,
# so the site answered 404. These routes put this Worker in front of them: a
# route runs on any proxied hostname of the zone, ahead of what the DNS record
# points at. While they are the way in, the Pages project's two custom domains
# (and the proxied records they created) must stay; removing them leaves the
# routes with no DNS name to run on. The tidier end state is custom domains on
# this Worker instead, which needs the Pages domains and their DNS records
# deleted first (DNS edit rights the wrangler login does not have).
routes = [
  { pattern = "www.waldorf.co.il/*", zone_name = "waldorf.co.il" },
  { pattern = "waldorf.co.il/*", zone_name = "waldorf.co.il" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Keep the .html addresses exactly as written (A2): the default would answer
# /page.html with a 307 to /page, a second hop after every 301 in _redirects.
html_handling = "none"
not_found_handling = "404-page"
# The Worker runs first for the www redirect, the ?p= links and the uploads.
run_worker_first = true

# Copy of the old site's /wp-content/uploads/ (A6).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "waldorf-uploads"
