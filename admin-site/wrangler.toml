# The admin, on an origin of its own.
#
# It used to be published with the site on GitHub Pages, at /admin/. One origin
# means one localStorage, so the session token and the management key the admin
# keeps there were readable by any script running on any public page: a single
# script bug on the site was an account takeover. Here no public page shares the
# origin. pages.yml now publishes redirects in place of the old /admin/ pages.
#
# Static assets only, no Worker code. Built from mockup/pages/admin plus the
# three shared scripts it loads from one level up:
#
#     node admin-site/build.mjs
#     cd admin-site && npx wrangler@4 deploy
#
# Served at admin.waldorf.co.il since 2026-11-10 (it was on
# waldorf-admin.orenknaan.workers.dev before); the workers.dev and preview
# addresses are off, so this is the one way in. The admin's own login is the
# barrier: Oren decided on 2026-11-10 against a Cloudflare Access wall, which
# made every editor sign in to Cloudflare first.
name = "waldorf-admin"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "admin.waldorf.co.il", custom_domain = true },
]

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
