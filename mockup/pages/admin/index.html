  --ink:#3D2B1F; --muted:#7A6555; --line:#E7DECE;
  --ok:#5E7D52; --ok-bg:#E7EEDF; --warn:#B7791F; --warn-bg:#F6E8C8;
  --crit:#A5533F; --crit-bg:#F1DED7; --info:#5E93A8; --info-bg:#DDEBEF;
  --shadow:0 2px 12px rgba(61,43,31,.08); --shadow-lg:0 12px 34px rgba(61,43,31,.16);
  --r:9px; --r-lg:16px; --r-pill:999px;
  --font-head:'Antropos Hebrew','Frank Ruhl Libre','Arial Hebrew',serif;
  --font-body:'Assistant','Segoe UI','Arial Hebrew',Arial,sans-serif;
  --sidebar:linear-gradient(200deg,#4A3623,#2F2114);
}
@media (prefers-color-scheme:dark){
  :root{
    --cream:#1F1710; --beige:#2A2019; --paper:#2C221A; --sink:#251C15;
    --tan:#C9A97E; --tan-dark:#D8BE97; --brown:#D8BC93; --brown-dark:#120C07;
    --ink:#F2E7D8; --muted:#B39C84; --line:#3A2D21;
    --ok:#9DC08A; --ok-bg:#26301F; --warn:#E0B65E; --warn-bg:#352a12;
    --crit:#D89079; --crit-bg:#35211a; --info:#8FC0CF; --info-bg:#16292f;
    --shadow:0 2px 12px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.5);
    --sidebar:linear-gradient(200deg,#241A11,#140D07);
  }
}
:root[data-theme="light"]{
  --cream:#FAF6F0; --beige:#F0E8DC; --paper:#FFFFFF; --sink:#F4EEE4;
  --tan:#C4A882; --tan-dark:#A88B69; --brown:#6B4F35; --brown-dark:#3D2B1F;
  --ink:#3D2B1F; --muted:#7A6555; --line:#E7DECE;
  --ok:#5E7D52; --ok-bg:#E7EEDF; --warn:#B7791F; --warn-bg:#F6E8C8;
  --crit:#A5533F; --crit-bg:#F1DED7; --info:#5E93A8; --info-bg:#DDEBEF;
  --shadow:0 2px 12px rgba(61,43,31,.08); --shadow-lg:0 12px 34px rgba(61,43,31,.16);
  --sidebar:linear-gradient(200deg,#4A3623,#2F2114);
}
:root[data-theme="dark"]{
  --cream:#1F1710; --beige:#2A2019; --paper:#2C221A; --sink:#251C15;
  --tan:#C9A97E; --tan-dark:#D8BE97; --brown:#D8BC93; --brown-dark:#120C07;
  --ink:#F2E7D8; --muted:#B39C84; --line:#3A2D21;
  --ok:#9DC08A; --ok-bg:#26301F; --warn:#E0B65E; --warn-bg:#352a12;
  --crit:#D89079; --crit-bg:#35211a; --info:#8FC0CF; --info-bg:#16292f;
  --shadow:0 2px 12px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.5);
  --sidebar:linear-gradient(200deg,#241A11,#140D07);
}
*{box-sizing:border-box}
#app{
  direction:rtl; font-family:var(--font-body); color:var(--ink);
  min-height:100vh; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--tan-dark);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ===== login ===== */
.login-screen{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(90% 60% at 12% 0%,color-mix(in oklab,var(--tan) 34%,transparent),transparent 60%),
    radial-gradient(80% 55% at 92% 8%,color-mix(in oklab,var(--info) 20%,transparent),transparent 60%),
    linear-gradient(180deg,var(--beige),var(--cream));
}
.login-card{
  width:100%;max-width:392px;background:var(--paper);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);border-top:3px solid var(--tan);padding:34px 32px 26px;
}
.emblem{width:52px;height:52px;display:block;margin-bottom:16px}
.login-card h1{font-size:1.5rem;color:var(--ink);margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:.9rem;margin:0 0 22px}
/* Buttons that read as links: "forgot password", "different address". Real
   buttons, because they act on this page rather than navigating anywhere. */
.linkish{background:none;border:0;padding:0;font:inherit;font-size:.86rem;
  color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkish:hover{color:var(--ink)}
.linkish:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink)}
.field input{
  font-family:inherit;font-size:.95rem;color:var(--ink);background:var(--sink);
  border:1.5px solid var(--line);border-radius:var(--r);padding:11px 13px;transition:.15s;
}
.field input:focus{outline:none;border-color:var(--tan);box-shadow:0 0 0 3px color-mix(in oklab,var(--tan) 40%,transparent);background:var(--paper)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;
  font-size:.92rem;padding:11px 18px;border-radius:var(--r-pill);border:1.5px solid transparent;
  text-decoration:none;transition:.15s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brown);color:#FBF6EE;width:100%;margin-top:4px}
.btn-primary:hover{background:color-mix(in oklab,var(--brown) 86%,#000)}
:root[data-theme="dark"] .btn-primary{color:#1a120a}
/* The same fix for the system setting, which is the state most people are
   actually in. Dark mode redefines --brown to a light tan, so the near-white
   label lands at 1.69:1 on its own button and all but disappears. Only the
   explicit theme choice was covered. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#1a120a}}
.btn-ghost{background:transparent;color:var(--brown);border-color:var(--tan)}
.btn-ghost:hover{background:var(--beige)}
.btn-sm{padding:7px 13px;font-size:.82rem}
.notice{
  display:flex;gap:8px;align-items:flex-start;margin:18px 0 2px;padding:9px 12px;
  /* Not var(--warn): amber on amber-tint is 2.99:1 at this size, under AA.
     --warn itself is left alone; on the page background it passes. */
  background:var(--warn-bg);color:#8A5A12;border-radius:var(--r);font-size:.8rem;line-height:1.45;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{color:var(--warn)}}
:root[data-theme="dark"] .notice{color:var(--warn)}
.notice svg{width:15px;height:15px;flex:none;margin-top:2px}

/* ===== dashboard shell ===== */
.dash{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:#EFE4D4;display:flex;flex-direction:column;padding:20px 0}
.side-brand{display:flex;align-items:center;gap:11px;padding:2px 22px 20px}
.side-brand .emblem{width:38px;height:38px;margin:0}
.side-brand b{font-family:var(--font-head);font-size:1.02rem;line-height:1.15;color:#fff}
.side-brand span{font-size:.7rem;color:var(--tan);letter-spacing:.06em}
.side-sec{font-size:.68rem;letter-spacing:.13em;color:rgba(255,255,255,.42);padding:14px 24px 6px;font-weight:600}
.nav-link{
  display:flex;align-items:center;gap:11px;padding:10px 22px;color:rgba(255,255,255,.78);
  font-size:.9rem;background:none;border:none;width:100%;text-align:start;
  border-inline-start:3px solid transparent;transition:.15s;
}
.nav-link svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-link .count{margin-inline-start:auto;font-size:.72rem;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:var(--r-pill);color:#fff}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-link.active{color:#fff;background:rgba(196,168,130,.18);border-inline-start-color:var(--tan)}
.side-foot{margin-top:auto;padding:16px 22px 0}

.main{display:flex;flex-direction:column;background:
  radial-gradient(70% 40% at 100% 0%,color-mix(in oklab,var(--tan) 12%,transparent),transparent 60%),
  var(--cream);min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--paper);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:1.28rem;color:var(--ink)}
.topbar .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--sink);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:7px 14px;color:var(--muted);min-width:210px}
.search svg{width:15px;height:15px;flex:none}
.search input{border:none;background:none;outline:none;font-family:inherit;font-size:.86rem;color:var(--ink);width:100%}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--paper);color:var(--brown)}
.icon-btn:hover{background:var(--beige)}
.icon-btn svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;color:#fff;background:radial-gradient(circle at 32% 28%,var(--tan),var(--brown))}
.user .who{font-size:.82rem;line-height:1.2}
.user .who b{color:var(--ink)}
.user .who span{color:var(--muted);font-size:.72rem}

.content{padding:24px 26px 48px;max-width:1080px;width:100%}
.view[hidden]{display:none}
.crumb{font-size:.78rem;color:var(--muted);margin-bottom:14px}

/* stats */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat .lbl{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .lbl svg{width:15px;height:15px;color:var(--tan-dark)}
.stat .num{font-family:var(--font-head);font-size:2.05rem;font-weight:700;color:var(--ink);line-height:1.1}
.stat .delta{font-size:.75rem;font-weight:600}
.stat .delta.up{color:var(--ok)} .stat .delta.flat{color:var(--muted)}
.stat .spark{position:absolute;inset-inline-end:12px;bottom:12px;width:66px;height:26px;opacity:.9}

/* panels + tables */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:1.06rem;color:var(--ink)}
.panel-head .grow{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.78rem;color:var(--muted);background:var(--sink);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:5px 12px}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
:root[data-theme="dark"] .chip.on{color:#1a120a}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{background:var(--sink);color:var(--ink);font-family:var(--font-head);font-weight:700;font-size:.78rem;letter-spacing:.02em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--beige)}
td .title{color:var(--ink);font-weight:600;white-space:normal}
td.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--beige);color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.act{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted)}
.act:hover{background:var(--sink);color:var(--brown)}
.act.danger:hover{background:var(--crit-bg);color:var(--crit)}
.act svg{width:16px;height:16px}
.ph{display:inline-block;background:var(--beige);border:1px dashed var(--tan-dark);color:var(--muted);font-size:.82em;padding:1px 9px;border-radius:var(--r-pill)}

.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.activity{display:flex;flex-direction:column;gap:2px;padding:8px 6px}
.act-item{display:flex;gap:12px;padding:11px 14px;border-radius:var(--r)}
.act-item:hover{background:var(--sink)}
.act-dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--beige);color:var(--brown)}
.act-dot svg{width:15px;height:15px}
.act-item .t{font-size:.86rem;color:var(--ink)}
.act-item .t b{color:var(--ink)}
.act-item .when{font-size:.74rem;color:var(--muted)}

.empty-hint{color:var(--muted);font-size:.86rem;padding:16px 20px}
@media (max-width:880px){
  .dash{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;padding:8px}
  .side-sec,.side-foot,.side-brand span{display:none}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .search{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body style="margin:0">
<div id="app">
<section id="login" class="login-screen">
    <div class="login-card"><form id="loginForm" novalidate>
      <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3D2B1F"/><path d="M16 6c-6 3-8 8-8 13 5-1 9-5 10-13-1 0-1 0-2 0z" fill="#C4A882"/></svg>
      <h1>מערכת ניהול התוכן</h1>
      <p class="sub">הפורום הארצי לחינוך ולדורף</p>
      <div class="lf">
        <div class="field">
          <label for="em">דוא״ל</label>
          <input id="em" type="email" placeholder="name@waldorf.co.il" autocomplete="username" autofocus>
        </div>
        <!-- Step two. Hidden until the address is known, so the page asks one
             question at a time and can tell an account awaiting its invite from
             one that simply has the wrong password. -->
        <div class="field" id="pwField" hidden>
          <label for="pw">סיסמה</label>
          <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="loginMsg" class="empty-hint" style="min-height:1.2em;margin:6px 0 0" role="status" aria-live="polite"></p>
        <button class="btn btn-primary" id="loginBtn" type="submit">המשך</button>
        <div id="loginLinks" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">
          <button type="button" class="linkish" id="forgotBtn" hidden>שכחתי סיסמה</button>
          <button type="button" class="linkish" id="backBtn" hidden>כתובת אחרת</button>
        </div>
      </div>
      <p class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        הכניסה מאומתת מול מסד הנתונים. בשלב הייצור תתווסף לכך שכבת Cloudflare Access.
      </p>
    </form></div>
  </section>
</div>

<script src="../store.js"></script>
<script>
/* כניסה בשני שלבים: קודם דוא"ל, ורק אחריו סיסמה.
   The address is checked first so the page can tell three cases apart that a
   single combined form collapses into one "wrong credentials": an account that
   has a password, an account still waiting for its invite, and an address with
   no account at all. */
(function () {
  var form = document.getElementById('loginForm');
  var em = document.getElementById('em'), pw = document.getElementById('pw');
  var pwField = document.getElementById('pwField');
  var btn = document.getElementById('loginBtn'), msg = document.getElementById('loginMsg');
  var forgotBtn = document.getElementById('forgotBtn'), backBtn = document.getElementById('backBtn');
  if (!form || !btn) return;

  if (window.WStore && WStore.isSignedIn()) location.replace('./admin-dashboard.html');

  var step = 'email';   // email | password
  var known = '';       // the address step one accepted

  function say(text, tone) {
    msg.textContent = text || '';
    // var(--crit), not a fixed red: the hard-coded one is 2.57:1 on the dark card.
    msg.style.color = tone === 'bad' ? 'var(--crit)' : '';
  }

  function toEmailStep() {
    step = 'email';
    known = '';
    pwField.hidden = true;
    pw.value = '';
    forgotBtn.hidden = true;
    backBtn.hidden = true;
    btn.textContent = 'המשך';
    em.disabled = false;
    em.focus();
    say('');
  }

  function toPasswordStep(email) {
    step = 'password';
    known = email;
    pwField.hidden = false;
    // Locked rather than hidden: the address stays visible so nobody types a
    // password for an account they did not mean.
    em.disabled = true;
    forgotBtn.hidden = false;
    backBtn.hidden = false;
    btn.textContent = 'כניסה למערכת';
    btn.disabled = false;
    pw.focus();
    say('');
  }

  function tooMany(err) {
    var mins = Math.ceil(((err && err.body && err.body.retryAfter) || 900) / 60);
    say('יותר מדי ניסיונות. נסו שוב בעוד ' + mins + ' דקות.', 'bad');
  }

  function checkEmail(email) {
    btn.disabled = true;
    say('בודק…');
    WStore.lookup(email).then(function (status) {
      btn.disabled = false;
      if (status === 'has_password') return toPasswordStep(email);
      if (status === 'needs_password') {
        known = email;
        backBtn.hidden = false;
        say('לחשבון הזה עדיין לא הוגדרה סיסמה. שלחו לעצמכם קישור להגדרתה.');
        offerLink(email, 'הגדרת סיסמה');
        return;
      }
      say('הכתובת אינה מוכרת במערכת. פנו למנהל־על כדי לפתוח חשבון.', 'bad');
    }).catch(function (err) {
      btn.disabled = false;
      if (err && err.status === 429) return tooMany(err);
      say('לא ניתן לבדוק את הכתובת כרגע. בדקו את החיבור לאינטרנט.', 'bad');
    });
  }

  /* Replaces the submit button with one that asks for a link, for both the
     "no password yet" and "forgot it" cases: the server treats them the same. */
  function offerLink(email, label) {
    btn.textContent = label;
    btn.disabled = false;
    step = 'link';
    btn.onclick = function (e) {
      e.preventDefault();
      btn.disabled = true;
      say('שולח…');
      WStore.requestReset(email).then(function (r) {
        btn.hidden = true;
        say(r && r.delivered
          ? 'נשלח קישור לכתובת ' + email + '. הקישור תקף לשימוש אחד.'
          : 'טרם מוגדר שירות דוא"ל, ולכן לא נשלחה הודעה. בקשו ממנהל־על ליצור עבורכם קישור להגדרת סיסמה.');
      }).catch(function () {
        btn.disabled = false;
        say('הבקשה נכשלה. נסו שוב.', 'bad');
      });
    };
  }

  function signIn(email, pass) {
    btn.disabled = true;
    say('מתחבר…');
    WStore.login(email, pass).then(function (u) {
      say('שלום ' + u.name + ' — מעביר לממשק…');
      location.href = './admin-dashboard.html';
    }).catch(function (err) {
      btn.disabled = false;
      if (err && err.status === 429) return tooMany(err);
      say(err && err.status === 401 ? 'סיסמה שגויה' : 'ההתחברות נכשלה — בדקו את החיבור לאינטרנט', 'bad');
      pw.select();
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (step === 'link') return;
    var email = (em.value || '').trim();
    if (step === 'email') {
      if (!email) { say('יש להזין כתובת דוא"ל', 'bad'); return; }
      return checkEmail(email);
    }
    var pass = pw.value || '';
    if (!pass) { say('יש להזין סיסמה', 'bad'); return; }
    signIn(known || email, pass);
  });

  backBtn.addEventListener('click', function () { btn.onclick = null; btn.hidden = false; toEmailStep(); });
  forgotBtn.addEventListener('click', function () {
    pwField.hidden = true;
    forgotBtn.hidden = true;
    say('נשלח קישור לבחירת סיסמה חדשה לכתובת ' + known + '.');
    offerLink(known, 'שליחת קישור');
  });
})();
</script>
</body>
