<p>תלמידי כיתה ו' ממחזור ט&quot;ו ב&quot;בית חינוך אלומות&quot; שבמ.א חבל מודיעין הציגו עיבוד לסיפור הקלאסי &quot;ארץ יצורי הפרא&quot;&nbsp;מאת מוריס סנדק. הסיפור עוסק במקס, ילד סורר המפליג לאי רחוק ומסתורי, שם הוא הופך למלך של יצורים פראיים, חוויה המעצימה את הדמיון ורגשות הילדות.</p>
