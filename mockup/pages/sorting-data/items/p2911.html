<p>שאלת המחקר של עבודה זו עוסקת בתנאים שצריכים להתקיים על מנת שהיתרונות של החינוך האנתרופוסופי<br>יבואו לידי ביטוי בכלל, ובהקשר של בשלות של ילד בכיתה א'. כאשר שאלת המחקר הראשית בעבודה זו הינה<br>כיצד הבשלות בכיתה א' באה לידי ביטוי בחינוך האנתרופוסופי.</p>
