# Content API for the mockup: D1 in, JSON out.
#
# Replaces the hardcoded seed arrays that used to ship inside data.js and the
# per-browser localStorage overlay that sat on top of them. Both the admin and
# the public pages now read from here, so an edit in the admin is the same
# record the site renders.
name = "waldorf-content-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Daily at 02:30 UTC: empty the recycle bin of anything older than 30 days
# (BIN_DAYS in src/index.js).
[triggers]
crons = ["30 2 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "waldorf-content"
database_id = "a8bb8c4e-5f95-4c8b-a246-2d4cf8adcc86"

# ---------------------------------------------------------------------------
# Newsletter (ActiveTrail / mymarketing.co.il)
#
# THE API TOKEN DOES NOT GO IN THIS FILE. This repository is public, so a token
# committed here is a token published, and deleting it later does not unpublish
# it: git history keeps serving it. ActiveTrail issues one account-wide token
# that can read, edit and delete the whole contact list, so treat it the way you
# would treat the account password.
#
# Set it once, from this directory, as an encrypted Worker secret:
#
#     npx wrangler secret put ACTIVETRAIL_TOKEN
#
# The command prompts for the value and does not echo it. It is stored encrypted
# by Cloudflare, injected as env.ACTIVETRAIL_TOKEN at runtime, and cannot be
# read back out of the dashboard afterwards. To rotate: run the same command
# again with the new value, then revoke the old token in the ActiveTrail UI
# under settings -> API apps.
#
# The two vars below are identifiers rather than credentials, so they belong in
# the file. ACTIVETRAIL_GROUP_ID is the group new subscribers join: find it with
# `GET /api/groups` on their API, or read it out of the group's URL in the
# ActiveTrail UI under Contacts -> Groups. Until it is filled in, the endpoint
# answers 503 and the form says the signup is not available yet.
#
# ACTIVETRAIL_DOUBLE_OPTIN left at "true" means ActiveTrail sends a confirmation
# mail and only subscribes the address once the visitor clicks it. Set it to
# "false" only if the forum decides it would rather subscribe people directly.
[vars]
ACTIVETRAIL_GROUP_ID = "715085"
ACTIVETRAIL_DOUBLE_OPTIN = "true"

# Where the admin is served from, used to build absolute set-password links.
# Without it the Worker falls back to the caller's Origin, right from a browser
# and empty from anything else, so a link minted by a script or destined for an
# email comes out relative and unusable.
ADMIN_BASE_URL = "https://waldorf-admin.orenknaan.workers.dev"

# The demo rows (demo = 1: invented events, videos, podcasts, a job ad, a board
# post) are hidden from visitors from launch on (launch-checklist B20). The
# admin still sees them, so they can be deleted there or replaced with real
# ones. "0" shows them again.
HIDE_DEMO = "1"

# ---------------------------------------------------------------------------
# Outgoing mail (Resend): set-password links and rejection notices
#
# Chosen 2026-11-07 (over ActiveTrail's operational messages, which turn every
# recipient into a contact in the marketing account). Both settings below are
# needed, plus the RESEND_API_KEY secret; until all three exist, a set-password
# link is shown to the super_admin to hand over, and a rejection notice opens
# prefilled in the moderator's own mail app. The key is set without it passing
# through a terminal or a chat, from the clipboard:
#
#     pbpaste | npx wrangler@4 secret put RESEND_API_KEY
#
# MAIL_FROM must be on a domain verified in Resend (waldorf.co.il). REPLY_TO is
# where a submitter's reply goes: info@, which Cloudflare Email Routing
# forwards to the forum's Gmail.
MAIL_FROM = "הפורום הארצי לחינוך ולדורף <no-reply@waldorf.co.il>"
REPLY_TO = "info@waldorf.co.il"

# Where the contact form and the work-group form send each submission
# (POST /api/forms/contact and /api/forms/workgroup), with Reply-To set to the
# visitor. The forum's Gmail, the same inbox info@ forwards to.
FORMS_TO = "haforumwaldorf@gmail.com"
