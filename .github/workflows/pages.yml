name: Deploy mockup preview to GitHub Pages

# Publishes the self-contained content mockups in mockup/pages/ to GitHub Pages
# so they can be shared for review. This is the preview mockup only — the real
# Astro site is deployed separately on Cloudflare Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Drop internal probe/harness files from the published preview
        run: rm -f mockup/pages/_*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mockup/pages
      - id: deployment
        uses: actions/deploy-pages@v4
