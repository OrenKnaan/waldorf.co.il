name: GitHub Pages redirects to www.waldorf.co.il

# The pre-launch preview used to be published here, at
# https://orenknaan.github.io/waldorf.co.il/. Since the launch (2026-11-06) the
# site is www.waldorf.co.il (site.yml), so this publishes one small page per
# old preview page that sends the visitor to the same page there, query and
# hash kept: links shared with the forum during review still land. The admin
# pages send to the admin's own origin, as before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write a redirect page for every preview page
        run: |
          out=gh-pages-redirects
          mkdir -p "$out/admin"
          stub() {
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>הפורום הארצי לחינוך ולדורף</title>' \
              "<link rel=\"canonical\" href=\"$1\"><meta http-equiv=\"refresh\" content=\"0; url=$1\">" \
              "<script>location.replace('$1' + location.search + location.hash);</script>" \
              "<a href=\"$1\">$1</a>"
          }
          for f in mockup/pages/*.html; do
            n=$(basename "$f")
            case "$n" in
              _*) continue ;;
              index.html|home.html) t=https://www.waldorf.co.il/ ;;
              *) t="https://www.waldorf.co.il/$n" ;;
            esac
            stub "$t" > "$out/$n"
          done
          for f in mockup/pages/admin/*.html; do
            n=$(basename "$f")
            stub "https://waldorf-admin.orenknaan.workers.dev/admin/$n" > "$out/admin/$n"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-redirects
      - id: deployment
        uses: actions/deploy-pages@v4
